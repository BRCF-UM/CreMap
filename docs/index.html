<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>CreMAP</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        --cremap-blue: #2c3e50;
        --cremap-teal: #18bc9c;
        --michigan-blue: #00274c;
        --michigan-maize: #ffcb05;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f7f9fb;
      }

      #cremap-app {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        opacity: 0;
        transition: opacity 180ms ease-in;
      }

      #cremap-app.is-ready { opacity: 1; }

      .loading-screen {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 35%, #ffffff 0, #f7f9fb 42%, #edf2f5 100%);
        color: var(--cremap-blue);
        text-align: center;
        transition: opacity 180ms ease-out, visibility 180ms ease-out;
      }

      .loading-screen.is-hidden {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }

      .loading-card { width: min(440px, 100%); }

      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin-bottom: 34px;
      }

      .brand-mark {
        display: grid;
        width: 54px;
        height: 54px;
        place-items: center;
        border-radius: 9px;
        background: var(--michigan-blue);
        color: var(--michigan-maize);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 34px;
        font-weight: 800;
        line-height: 1;
      }

      .brand-name {
        color: var(--michigan-blue);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .spinner {
        width: 54px;
        height: 54px;
        margin: 0 auto 24px;
        border: 5px solid #dbe4e9;
        border-top-color: var(--cremap-teal);
        border-radius: 50%;
        animation: spin 850ms linear infinite;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        line-height: 1.25;
      }

      p {
        margin: 0;
        color: #60717e;
        font-size: 16px;
        line-height: 1.55;
      }

      .slow-message {
        display: none;
        margin-top: 22px;
        font-size: 14px;
      }

      .slow-message.is-visible { display: block; }

      a {
        color: #087f6b;
        font-weight: 600;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        #cremap-app,
        .loading-screen { transition: none; }
        .spinner { animation-duration: 1.8s; }
      }
    </style>
  </head>
  <body>
    <main
      id="loading-screen"
      class="loading-screen"
      role="status"
      aria-live="polite"
      aria-label="CreMAP is loading"
    >
      <div class="loading-card">
        <div class="brand" aria-label="Michigan Medicine CreMAP">
          <span class="brand-mark" aria-hidden="true">M</span>
          <span class="brand-name">CreMAP</span>
        </div>
        <div class="spinner" aria-hidden="true"></div>
        <h1>Loading CreMAP…</h1>
        <p>Starting the analysis server. The first visit after a period of inactivity may take up to a minute.</p>
        <p id="slow-message" class="slow-message">
          Still working—thank you for waiting. You can also
          <a href="https://cremap.shinyapps.io/cremap/" target="_blank" rel="noopener">open CreMAP directly</a>.
        </p>
      </div>
    </main>

    <iframe
      id="cremap-app"
      src="https://cremap.shinyapps.io/cremap/"
      title="CreMAP single-cell RNA-seq explorer"
      allow="fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>

    <noscript>
      <p>
        JavaScript is required for the loading screen.
        <a href="https://cremap.shinyapps.io/cremap/">Open CreMAP</a>.
      </p>
    </noscript>

    <script>
      (function () {
        var app = document.getElementById("cremap-app");
        var loadingScreen = document.getElementById("loading-screen");
        var slowMessage = document.getElementById("slow-message");
        var appOrigin = "https://cremap.shinyapps.io";
        var isReady = false;

        function showApp() {
          if (isReady) return;
          isReady = true;
          app.classList.add("is-ready");
          loadingScreen.classList.add("is-hidden");
          loadingScreen.setAttribute("aria-hidden", "true");
        }

        window.addEventListener("message", function (event) {
          if (
            event.source === app.contentWindow &&
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "cremap-ready"
          ) {
            showApp();
          }
        });

        window.setTimeout(function () {
          if (!isReady) slowMessage.classList.add("is-visible");
        }, 20000);
      }());
    </script>
  </body>
</html>
